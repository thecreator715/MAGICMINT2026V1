<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MagicMint Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070b;--ink:#eef3ef;--mut:#8b97a0;--acc:#3dff4a;--gold:#d9a441;--pnl:rgba(8,12,16,.72);--ln:rgba(255,255,255,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070b}}
:root[data-theme="dark"]{--bg:#05070b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;pointer-events:none}
#cross{left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;opacity:.7;transition:transform .15s,opacity .15s}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;border-radius:2px}
#cross:before{left:8px;top:0;width:2px;height:18px;opacity:.0}#cross:after{left:0;top:8px;width:18px;height:2px;opacity:0}
#cross i{position:absolute;left:7px;top:7px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}
#cross.hot{transform:scale(1.9);opacity:1}#cross.hot i{background:var(--acc);box-shadow:0 0 12px var(--acc)}
#hint{left:50%;top:calc(50% + 34px);transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--pnl);border:1px solid var(--ln);padding:6px 12px;border-radius:99px;opacity:0;transition:opacity .2s;white-space:nowrap}
#hint.on{opacity:1}
#banner{left:0;right:0;top:16%;text-align:center;opacity:0;transition:opacity 1s;padding:0 16px}
#banner.on{opacity:1}
#banner small{display:block;font-size:12px;letter-spacing:.42em;color:var(--mut);text-transform:uppercase;margin-bottom:8px}
#banner b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(30px,6vw,64px);letter-spacing:.06em;text-shadow:0 2px 30px #000}
.btns{right:16px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:8px;pointer-events:auto}
.btn{pointer-events:auto;cursor:pointer;border:1px solid var(--ln);background:var(--pnl);color:var(--ink);font:600 12px 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;border-radius:12px;backdrop-filter:blur(8px)}
.btn.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 18px rgba(61,255,74,.35)}
#help{left:16px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;line-height:1.8}
#help b{color:var(--ink);font-weight:600}
#info{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,30px);width:min(520px,calc(100% - 32px));background:var(--pnl);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px);opacity:0;transition:all .35s;pointer-events:auto;z-index:5}
#info.on{opacity:1;transform:translate(-50%,0)}
#info h3{margin:0 0 2px;font:600 22px 'Cormorant Garamond',serif;letter-spacing:.03em}
#info .meta{font-size:12px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
#info .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#info .chip{border:1px solid var(--ln);border-radius:99px;padding:4px 10px;font-size:12px}
#info p{margin:10px 0 0;font-size:13px;color:#cfd8d2;line-height:1.5}
#info .x{position:absolute;right:10px;top:8px;cursor:pointer;color:var(--mut);font-size:20px;padding:4px 8px}
#map{position:fixed;inset:0;background:rgba(3,5,8,.9);backdrop-filter:blur(8px);display:none;z-index:8;padding:16px;gap:16px;align-items:stretch;justify-content:center}
#map.on{display:flex}
#map canvas{height:100%;max-height:calc(100vh - 32px);border:1px solid var(--ln);border-radius:14px;background:#04060a;touch-action:none}
#chap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-content:start;width:min(360px,50vw);overflow:auto}
#chap h4{grid-column:1/-1;margin:0;font:600 12px 'Chakra Petch';letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
#chap .c{pointer-events:auto;cursor:pointer;text-align:left;border:1px solid var(--ln);border-left:4px solid var(--a,#fff);background:var(--pnl);color:var(--ink);border-radius:10px;padding:10px;font:600 12px 'Chakra Petch';letter-spacing:.06em}
#chap .c span{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:2px}
#chap .full{grid-column:1/-1}
#load{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 90% at 50% 40%,#0c1410,#030507);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s}
#load h1{font:600 clamp(34px,8vw,84px)/1 'Cormorant Garamond',serif;letter-spacing:.08em;margin:0}
#load h1 em{font-style:normal;color:var(--acc);text-shadow:0 0 30px rgba(61,255,74,.6)}
#load p{color:var(--mut);letter-spacing:.3em;font-size:12px;text-transform:uppercase;margin:14px 0 26px}
#bar{width:min(320px,70vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 14px var(--acc);transition:width .2s}
#enter{margin-top:26px;display:none;font-size:14px;padding:14px 28px;border-color:var(--acc);color:var(--acc)}
#fxbar{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);display:none;gap:6px;z-index:6;flex-wrap:wrap;justify-content:center;width:min(560px,calc(100% - 24px))}#fxbar.on{display:flex}#fxbar span{cursor:pointer;border:1px solid var(--ln);background:var(--pnl);border-radius:99px;padding:8px 13px;font:600 11px 'Chakra Petch';letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(8px)}#fxbar span.on{border-color:var(--acc);color:var(--acc);box-shadow:0 0 14px rgba(61,255,74,.35)}
#fps{right:16px;bottom:10px;font-size:10px;color:#46525a}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:1px solid var(--ln);background:rgba(255,255,255,.05);display:none;pointer-events:none;z-index:4}
#stick i{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.28)}
@media (max-width:700px){#map{flex-direction:column;overflow:auto}#map canvas{height:46vh;align-self:center;flex:none}#chap{width:100%}#help{display:none}.btn{padding:9px 11px}}
</style></head>

<script>
(()=>{
const T=THREE, $=s=>document.querySelector(s);
const TOUCH=matchMedia('(pointer:coarse)').matches||('ontouchstart' in window);
const DBG=/[?&]debug/.test(location.search);
let NAV,DATA;
// ------------------------------------------------------------ renderer
const cvs=$('#c');
const renderer=new T.WebGLRenderer({canvas:cvs,antialias:false,powerPreference:'high-performance'});

(function(){

  const es=new T.Scene();
  es.add(new T.Mesh(new T.BoxGeometry(30,16,30),new T.MeshBasicMaterial({color:0x3a3f48,side:T.BackSide})));
  const mk=(c,x,y,z,w,h,d)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial({color:c}));m.position.set(x,y,z);es.add(m)};
  mk(0xffe6bf,0,7.6,0,18,0.3,18);mk(0xfff4e0,-14,3,0,0.3,5,10);mk(0xbfd8ff,14,3,0,0.3,5,10);mk(0xffffff,0,3,-14,12,5,0.3);

// lights
const hemi=new T.HemisphereLight(0xaab6d0,0x2a2320,0.3);scene.add(hemi);
const key=new T.SpotLight(0xfff0d8,0,150,1.15,.75,1);key.castShadow=true;key.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);key.shadow.camera.near=1;key.shadow.camera.far=150;key.shadow.bias=-.0008;key.shadow.normalBias=.04;key.shadow.radius=3;scene.add(key);scene.add(key.target);let shadowDirty=4;

// composer: MSAA + bloom + grade
let composer,bloom,finalP;
function buildComposer(){
  const w=innerWidth,h=innerHeight,gl2=renderer.capabilities.isWebGL2;
  const hf=gl2&&renderer.extensions.get('EXT_color_buffer_float');

  composer.addPass(new T.RenderPass(scene,camera));
  bloom=new T.UnrealBloomPass(new T.Vector2(w,h),0.5,0.5,0.7);composer.addPass(bloom);
  finalP=new T.ShaderPass({uniforms:{tDiffuse:{value:null},time:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;
  float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+time)*43758.5453);}
  void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;vec2 q=vUv-.5;c*=1.-dot(q,q)*.75;
  c=mix(c,c*c*(3.-2.*c),.18);c=pow(max(c,0.),vec3(1./2.2));c+=(h(vUv*900.)-.5)*.012;gl_FragColor=vec4(c,1.);}`});
  composer.addPass(finalP);
}
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setPixelRatio(PR);renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w/h<0.8?78:66;camera.updateProjectionMatrix();
  if(composer){composer.setPixelRatio(PR);composer.setSize(w,h)}
}
addEventListener('resize',resize);resize();buildComposer();
// ------------------------------------------------------------ sky
const sky=new T.Mesh(new T.SphereGeometry(900,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{dim:{value:1},time:{value:0}},
vertexShader:'varying vec3 d;void main(){d=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:`varying vec3 d;uniform float dim,time;
float h(vec3 p){p=fract(p*.3183+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
void main(){float y=d.y;vec3 hor=vec3(.20,.12,.30),mid=vec3(.04,.06,.16),top=vec3(.012,.018,.05);
vec3 c=mix(hor,mid,smoothstep(-.05,.25,y));c=mix(c,top,smoothstep(.2,.85,y));
vec3 q=floor(d*620.);float s=h(q);float st=step(.9988,s)*smoothstep(.0,.3,y);c+=vec3(.9,.95,1.)*st*(.6+.4*h(q+3.));
vec3 mo=normalize(vec3(-.45,.52,-.72));float md=dot(d,mo);c+=vec3(.9,.93,1.)*smoothstep(.9985,.9992,md)+vec3(.35,.4,.7)*pow(max(md,0.),90.)*.35;
float au=pow(max(0.,sin(d.x*5.+sin(d.z*4.+time*.15)*2.2+time*.07)),9.)*smoothstep(.08,.4,y)*(1.-smoothstep(.45,.9,y));c+=mix(vec3(.1,.9,.4),vec3(.5,.3,1.),.5+.5*sin(d.z*3.+time*.1))*au*.4;c=mix(c*.6,c,step(-.02,y));gl_FragColor=vec4(c*dim,1.);
#include <encodings_fragment>
}`}));
sky.renderOrder=-10;scene.add(sky);
const ground=new T.Mesh(new T.PlaneGeometry(2400,2400),new T.MeshBasicMaterial({color:0x04060a}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.42;scene.add(ground);
new T.TextureLoader().load('skyline.png',t=>{
  t.wrapS=T.RepeatWrapping;t.repeat.set(3,1);t.encoding=T.sRGBEncoding;
  const m=new T.Mesh(new T.CylinderGeometry(420,420,95,64,1,true),new T.MeshBasicMaterial({map:t,transparent:true,side:T.BackSide,fog:false,depthWrite:false}));
  m.position.y=38;m.renderOrder=-9;scene.add(m);sky.userData.skyline=m;
});
// ------------------------------------------------------------ paint shader
const PV='varying vec2 vUv;varying vec3 vW;void main(){vUv=uv;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}';
const PF=`uniform sampler2D map;uniform float has;uniform vec3 cam,Tg,Nm,tint,acc;uniform float bright,rare,time,fade,haunt,ph,fx,flash;uniform vec2 tilt;uniform float mode;
varying vec2 vUv;varying vec3 vW;
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(mod(h*6.+vec3(0.,4.,2.),6.)-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
float hh(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hh(i),hh(i+vec2(1,0)),f.x),mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x),f.y);}
vec3 tx(vec2 u){return texture2D(map,clamp(u,0.,1.)).rgb;}
void main(){
 vec2 uv=vUv;if(mode>.5)uv.y=1.-uv.y;
 float tt=time*.7+ph;
 if(haunt>0.){uv+=haunt*.011*vec2(sin(uv.y*9.+tt*1.9),cos(uv.x*7.+tt*1.3));uv=(uv-.5)*(1.-.035*haunt*(.5+.5*sin(tt*.8)))+.5;}
 if(fx>5.5){float sl=floor(uv.y*16.+time*7.);float r=hh(vec2(sl,floor(time*9.)));uv.x+=(r-.5)*.14*step(.72,r);}
 vec3 c=tint;
 if(has>.5){c=tx(uv);vec2 e=vec2(.0028,.0026);vec3 bl=(tx(uv+vec2(e.x,0.))+tx(uv-vec2(e.x,0.))+tx(uv+vec2(0.,e.y))+tx(uv-vec2(0.,e.y)))*.25;c=clamp(c+(c-bl)*.7,0.,1.);
  if(fx>5.5){c.r=tx(uv+vec2(.014,0.)).r;c.b=tx(uv-vec2(.014,0.)).b;if(hh(vec2(floor(time*6.),3.))>.86)c=1.-c;}
  if(haunt>0.){float pu=smoothstep(.5,1.,sin(time*.35+ph*3.));vec3 g=tx(uv+vec2(.035*sin(time+ph),.018));c=mix(c,max(c,g.bgr*.9),haunt*pu*.65);c*=1.-haunt*.4*step(.965,hh(vec2(floor(time*11.),ph)));}
 }
 c=pow(c,vec3(2.2));
 vec3 V=normalize(cam-vW);
 float ang=mode>.5?tilt.x*1.4+tilt.y*.6:dot(V,Tg);
 float fr=mode>.5?clamp(length(tilt)*1.2,0.,1.):1.-abs(dot(V,Nm));
 float lum=dot(c,vec3(.3,.59,.11));
 float sw=vUv.x*.9+vUv.y*.55+ang*1.7+time*.025;
 vec3 rb=hsv(fract(sw),.78,1.);
 float band=smoothstep(0.,.55,sin(sw*18.85)*.5+.5);
 float k=(.09+.6*rare+(mode>.5?.2:0.)+flash*.8)*(.3+fr*1.3)*(.35+lum);
 if(fx>.5&&fx<1.5)k=k*3.+.25*(.4+lum);
 c+=rb*k*band;
 float g=pow(max(0.,sin((vUv.x+vUv.y)*10.+ang*11.+time*.45)),26.)*(.12+.55*rare+(mode>.5?.25:0.));
 c+=vec3(1.,.93,.78)*g;
 if(fx>1.5&&fx<2.5){float f=nz(vUv*vec2(5.,3.)+vec2(0.,-time*1.3))*(1.25-vUv.y*1.15)+.35*nz(vUv*14.+vec2(0.,-time*2.6))*(1.-vUv.y);c=c*vec3(1.1,.8,.6)+vec3(1.8,.55,.08)*pow(clamp(f,0.,1.),2.2)*1.6;}
 else if(fx>2.5&&fx<3.5){c=mix(c,vec3(lum)*vec3(.55,.85,1.25),.6);float ed=1.-min(min(vUv.x,1.-vUv.x),min(vUv.y,1.-vUv.y))*2.;float cr=pow(nz(vUv*34.),3.)*smoothstep(.25,1.,ed+.35*nz(vUv*4.+time*.1));c+=vec3(.7,.9,1.)*cr*2.2+vec3(1.)*step(.992,hh(floor(vUv*90.)+floor(time*4.)))*.9;}
 else if(fx>3.5&&fx<4.5){c=mix(vec3(lum),c,.2)*vec3(.6,1.05,.9);c+=pow(tx(uv+vec2(.04*sin(time*1.3),.02*cos(time))),vec3(2.2)).bgr*.35;c*=.65+.5*sin(vUv.y*22.-time*3.5);}
 else if(fx>4.5&&fx<5.5){float l=abs(vUv.x-.5+(nz(vec2(vUv.y*6.,time*6.))-.5)*.55);float l2=abs(vUv.y-.5+(nz(vec2(vUv.x*5.+9.,time*7.))-.5)*.5);c+=(acc+.35)*(.005/l+.003/l2);}
 c+=acc*flash*.5;
 c*=bright*(.86+.22*vUv.y)*fade;
 gl_FragColor=vec4(c,1.);
 #include <tonemapping_fragment>
 #include <encodings_fragment>
}`;
function paintMat(){return new T.ShaderMaterial({vertexShader:PV,fragmentShader:PF,uniforms:{map:{value:null},has:{value:0},cam:{value:camera.position},Tg:{value:new T.Vector3(1,0,0)},Nm:{value:new T.Vector3(0,0,1)},tint:{value:new T.Color(.08,.09,.1)},bright:{value:1},rare:{value:0},time:{value:0},fade:{value:0},tilt:{value:new T.Vector2()},mode:{value:0},haunt:{value:0},ph:{value:Math.random()*6},fx:{value:0},flash:{value:0},acc:{value:new T.Color(.2,1,.3)}}})}
// ------------------------------------------------------------ world
const regions={};   // key -> objects[]
const paints={};    // id -> {mesh,mat,card,room,base}
const paintList=[];
const glowMats=[],stdMats=[];
// ===== WORLD: park, castle, shops, NPCs, battles
const NPCS=[];let nearNpc=null,dlgOpen=null,worldGrp=null,pendingBattle=null;

  const br=.95*lit+1.35*glow;const cp=camera.position;

    if(p.hk){const lurch=Math.pow(Math.max(0,Math.sin(t*.23+p.ph*2.7)),40);target+=p.hk*(.09+.05*Math.sin(t*.5+p.ph)+.35*lurch);ang=p.hk*(.05*Math.sin(t*.6+p.ph)+.12*lurch*Math.sin(t*9))}

const sel=[];
function assignLights(reg,lit,gk){
  sel.length=0;
  const cp=camera.position;
  for(const L of lamps){
    let pen=0;
    if(L.reg!==reg){
      const adj=(reg==='SPINE'&&L.reg[0]==='R')||(reg[0]==='R'&&L.reg==='SPINE')||(reg==='EXT'&&L.reg==='LOBBY')||(reg==='LOBBY'&&(L.reg==='SPINE'||L.reg==='EXT'));
      if(!adj)continue;pen=120;
    }
    const d=L.p.distanceToSquared(cp)+pen;
    if(d<1600+pen)sel.push([d,L]);
  }
  sel.sort((a,b)=>a[0]-b[0]);
  for(let i=0;i<lights.length;i++){
    const li=lights[i],s=sel[i];
    if(!s){li.intensity=0;continue}
    const L=s[1];li.position.copy(L.p);
    const mp=(MOOD[reg]||MOOD.EXT)[0]/.4;if(glow>.5){const acc=reg[0]==='R'?lc(DATA.series[+reg.slice(1)-1].ac):L.col;li.color.copy(acc);li.distance=20;li.intensity=(.42+.1*Math.sin(tAcc*.8+i))*glow}
    else{li.color.copy(L.col);li.distance=reg==='EXT'?30:28;li.intensity=(reg==='EXT'?.95:.34*Math.min(1.3,mp))*L.i*lit*(i<POOL-2?1:.7)}
    if(glow>.02&&lit>.02)li.intensity+=(.75*L.i*lit)*0;
  }
}
